server:
  port: 8090

spring:
  application:
    name: algorycode-rent-service
  datasource:
    url: jdbc:mysql://45.147.47.129:3306/algorycoderentdb
    username: root
    password: algorycode1.
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # MySQL şeması CHAR(36); Hibernate 7 varsayılanı BINARY(16) — validate uyumu için CHAR kullan.
        type:
          preferred_uuid_jdbc_type: CHAR
  # AuthService / mail-service ile aynı broker (DNS: rabbitmq.algorycode.com veya küme içi servis)
  rabbitmq:
    host: rabbitmq.algorycode.com
    port: 5672
    username: admin
    password: GuvenliSifre123
    virtual-host: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

app:
  # CORS: SecurityConfig.corsConfigurationSource — virgülle ayırın (Helm: APP_CORS_ALLOWED_ORIGIN_PATTERNS)
  cors:
    allowed-origin-patterns: "http://localhost:*,http://127.0.0.1:*"
  mail:
    rabbit:
      exchange: rent.mail
      routing-key: mail.send.requested
      queue-dlq: rent.mail.dlq

info:
  app:
    name: algorycode-rent-service
    description: AlgoryRent management API
    version: 1.0.0

logging:
  level:
    org.hibernate.SQL: WARN
    com.algorycode.rent: INFO
