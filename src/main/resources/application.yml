server:
  port: 8090
  tomcat:
    max-http-form-post-size: 120MB

spring:
  servlet:
    multipart:
      max-file-size: 55MB
      max-request-size: 120MB
  thymeleaf:
    encoding: UTF-8
  application:
    name: algorycode-rent-service
  datasource:
    # algory-workspace-service ile aynı PostgreSQL sunucusu; veritabanı önce oluşturulmalı:
    # CREATE DATABASE algorycoderentdb;
    url: jdbc:postgresql://213.142.151.236:5432/algorycoderentdb
    username: postgres
    password: algorycode1.
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET search_path TO public
  flyway:
    enabled: ${APP_FLYWAY_ENABLED:false}
    baseline-on-migrate: true
    default-schema: public
    schemas: public
    locations: classpath:db/migration
  jpa:
    show-sql: false
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: never
  # AuthService / mail-service ile aynı broker (DNS: rabbitmq.algorycode.com veya küme içi servis)
  rabbitmq:
    host: localhost
    #host: rabbitmq.algorycode.com
    port: 5672
    username: admin
    password: guclusifre
    #password: GuvenliSifre123
    virtual-host: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# Gateway: lb://ALGORYCODE-RENT-SERVICE — spring.application.name ile Eureka’da aynı isim (büyük harf) kullanılır.
eureka:
  instance:
    preferIpAddress: true
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8070/eureka/}

app:
  # Gateway CORS veriyorsa false bırakın; aksi halde çift Access-Control-Allow-Origin (tarayıcı CORS hatası).
  # Tarayıcı doğrudan 8090’a gidiyorsa true + allowed-origin-patterns.
  cors:
    enabled: false
    allowed-origin-patterns: "*"
  mail:
    rabbit:
      # mail-service ile aynı exchange (MailRabbitTopologyConfiguration); routing key mail.# ile eşleşir
      exchange: algorycode.mail.exchange
      routing-key: mail.send.requested
      queue-dlq: algorycode.mail.work-queue.dlq
  rental-request:
    # Yurt dışı çıkış seçilirse otomatik eklenen yeşil sigorta ücreti.
    green-insurance-fee: 75.00
    # Handover EUR satırlarını TRY’ye çevirmek için gösterge kur (fatura özeti).
    try-per-eur: 36.20
  contract:
    # Boş: PDF tamamen uygulama içi İngilizce yetkilendirme şablonu ile üretilir.
    template-path: ""
    output-dir: ./generated-contracts
    # PDF ek hizmet tablosu: satir tutarlari KDV dahil; 0 vergi sutununu sifirlar.
    pdf-line-vat-percent: 20
    authorization:
      taxable-person-name: "KURU GLOBAL"
      nipt-number: "M51406058A"
      representative-name: "TARIK KURU"
      representative-birth-place: "ISTANBUL"
      representative-residence: "TIRAN"
      representative-birth-date: "21/07/2000"
      representative-passport-no: "U36724300"
      footer-company: "KURU GLOBAL"
      footer-address: "RINAS AIRPORT - Rinas, Albania."
      roadside-assistance-phone: "+90 510 220 553"
  whatsapp:
    # Talep oluşturulunca sözleşme PDF’i yöneticiye iletilmesi (webhook: JSON + documentBase64).
    enabled: true
    admin-phone-e164: "905312187455"
    webhook-url: ${APP_WHATSAPP_WEBHOOK_URL:}
    webhook-auth-bearer: ${APP_WHATSAPP_WEBHOOK_BEARER:}
    # PDF için webhook yoksa isteğe bağlı metin bildirimi (CallMeBot ücretsiz API — PDF göndermez).
    callmebot-api-key: ${APP_WHATSAPP_CALLMEBOT_API_KEY:}
  object-storage:
    enabled: ${APP_OBJECT_STORAGE_ENABLED:true}
    endpoint: ${APP_OBJECT_STORAGE_ENDPOINT:https://s3.algorycode.com}
    bucket: ${APP_OBJECT_STORAGE_BUCKET:rent}
    access-key: ${APP_OBJECT_STORAGE_ACCESS_KEY:ld88HanEcv4q2BR0}
    secret-key: ${APP_OBJECT_STORAGE_SECRET_KEY:DuE4w8K3jONhT8FfTd2ZaUzkszlJ4r0i}
    key-prefix: ${APP_OBJECT_STORAGE_KEY_PREFIX:prod}
    presign-expiry-seconds: ${APP_OBJECT_STORAGE_PRESIGN_EXPIRY_SECONDS:3600}

info:
  app:
    name: algorycode-rent-service
    description: AlgoryRent management API
    version: 1.0.0

logging:
  level:
    org.hibernate.SQL: WARN
    com.algorycode.rent: INFO
    AUDIT: INFO
