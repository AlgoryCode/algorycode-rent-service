server:
  port: 8090

spring:
  application:
    name: algorycode-rent-service
  datasource:
    url: jdbc:mysql://45.147.47.129:3306/algorycoderentdb
    username: root
    password: algorycode1.
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # MySQL şeması CHAR(36); Hibernate 7 varsayılanı BINARY(16) — validate uyumu için CHAR kullan.
        type:
          preferred_uuid_jdbc_type: CHAR
  # AuthService / mail-service ile aynı broker (DNS: rabbitmq.algorycode.com veya küme içi servis)
  rabbitmq:
    host: rabbitmq.algorycode.com
    port: 5672
    username: admin
    password: GuvenliSifre123
    virtual-host: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

app:
  # "*" = tüm Origin; credential (cookie) tarayıcıda yasak. Daraltmak için virgülle domain listesi.
  cors:
    allowed-origin-patterns: "*"
  mail:
    rabbit:
      exchange: rent.mail
      routing-key: mail.send.requested
      queue-dlq: rent.mail.dlq
  rental-request:
    # Yurt dışı çıkış seçilirse otomatik eklenen yeşil sigorta ücreti.
    green-insurance-fee: 75.00
  contract:
    # Kullanıcının verdiği sözleşme şablonu (2 sayfa olsa da ilk sayfa baz alınır).
    template-path: "/home/tarik/İndirilenler/KURU GLOBAL SÖZLEŞME.pdf"
    # Çıkan PDF dosyaları backend kökünde bu klasöre yazılır.
    output-dir: ./generated-contracts
  whatsapp:
    # Talep oluşturulunca sözleşme PDF’i yöneticiye iletilmesi (webhook: JSON + documentBase64).
    enabled: true
    admin-phone-e164: "905312187455"
    webhook-url: ${APP_WHATSAPP_WEBHOOK_URL:}
    webhook-auth-bearer: ${APP_WHATSAPP_WEBHOOK_BEARER:}
    # PDF için webhook yoksa isteğe bağlı metin bildirimi (CallMeBot ücretsiz API — PDF göndermez).
    callmebot-api-key: ${APP_WHATSAPP_CALLMEBOT_API_KEY:}

info:
  app:
    name: algorycode-rent-service
    description: AlgoryRent management API
    version: 1.0.0

logging:
  level:
    org.hibernate.SQL: WARN
    com.algorycode.rent: INFO
