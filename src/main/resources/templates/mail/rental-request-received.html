<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title th:text="${mailSubject}">Rezervasyon</title>
</head>
<body style="margin:0;background:#f4f5f7;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f7;padding:24px 12px;">
  <tr><td align="center">
    <table role="presentation" width="100%" style="max-width:560px;background:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e6e8ec;">
      <tr><td style="padding:28px 24px 8px 24px;font-size:18px;font-weight:600;color:#111827;" th:text="${mailSubject}">Başlık</td></tr>
      <tr><td style="padding:8px 24px 20px 24px;font-size:15px;line-height:1.55;color:#374151;">
        Merhaba <strong th:text="${customerName}">Ad</strong>,
        <p style="margin:16px 0 0 0;">Rezervasyon talebiniz başarıyla alınmıştır. Kaydınız incelenmektedir; sonuç size bu e-posta adresi üzerinden iletilecektir.</p>
      </td></tr>
      <tr><td style="padding:0 24px 24px 24px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f9fafb;border-radius:10px;border:1px solid #eef0f3;">
          <tr><td colspan="2" style="padding:14px 16px 6px 16px;font-size:13px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:.04em;">Özet</td></tr>
          <tr><td style="padding:6px 16px 4px 16px;color:#6b7280;font-size:13px;width:38%;">Referans</td><td style="padding:6px 16px 4px 16px;color:#111827;font-size:14px;font-weight:600;" th:text="${referenceNo}">—</td></tr>
          <tr><td style="padding:6px 16px 4px 16px;color:#6b7280;font-size:13px;">Alış / İade</td><td style="padding:6px 16px 4px 16px;color:#111827;font-size:14px;"><span th:text="${startDateFormatted}">—</span> – <span th:text="${endDateFormatted}">—</span></td></tr>
          <tr><td style="padding:6px 16px 14px 16px;color:#6b7280;font-size:13px;">Araç</td><td style="padding:6px 16px 14px 16px;color:#111827;font-size:14px;" th:text="${vehicleLine}">—</td></tr>
        </table>
      </td></tr>
      <tr><td style="padding:0 24px 24px 24px;font-size:12px;line-height:1.5;color:#9ca3af;">Bu e-posta otomatik gönderilmiştir; lütfen yanıtlamayınız.</td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
