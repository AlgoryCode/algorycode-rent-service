# Rent API — HTTPS: rent.algorycode.com → Service (namespace: rent)
#
# DNS: rent.algorycode.com → Traefik LoadBalancer / düğüm IP (A kaydı).
#
# Sertifika: cert-manager kurulu olmalı. Bir kez ClusterIssuer uygulayın:
#   k8s/clusterissuer-letsencrypt-http01.example.yaml  (içinde e-posta düzenleyin)
#
# Ingress:
#   kubectl apply -f k8s/ingress-rent-api.yaml
#
# FE / BFF upstream URL’lerini bu host’a göre güncellemeyi unutmayın (https://rent.algorycode.com).
#
# Traefik tarafı, cluster’ınızdaki rabbitmq Ingress ile aynı stil:
#   traefik.ingress.kubernetes.io/router.tls: "true"
# (LoadBalancer IP örn. rabbitmq ile aynı düğüm: 45.74.244.146 — DNS A kaydı buna.)

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rent-api-algorycode-rent-service
  namespace: rent
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
    # Sertifikayı cert-manager üretiyorsa (rabbitmq-tls gibi); issuer adını cluster’ınıza göre seçin
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - rent.algorycode.com
      secretName: rent-algorycode-tls
  rules:
    - host: rent.algorycode.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rent-api-algorycode-rent-service
                port:
                  number: 8090

