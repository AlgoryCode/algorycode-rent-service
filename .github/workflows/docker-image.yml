name: algorycode-rent-service CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: rent-service-build-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: algorycode-rent-service
  K8S_NAMESPACE: rent
  K8S_DEPLOYMENT: rent-api-algorycode-rent-service

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image tag (last 7 chars of SHA)
        run: |
          TAG="${GITHUB_SHA: -7}"
          echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "Using tag: $TAG"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"
          docker build -t "${IMAGE}:${IMAGE_TAG}" .
          docker push "${IMAGE}:${IMAGE_TAG}"

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.28.0

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | tr -d '\n\r ' | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Restart deployment
        run: |
          kubectl --insecure-skip-tls-verify -n "${{ env.K8S_NAMESPACE }}" rollout restart "deployment/${{ env.K8S_DEPLOYMENT }}"
          kubectl --insecure-skip-tls-verify -n "${{ env.K8S_NAMESPACE }}" rollout status "deployment/${{ env.K8S_DEPLOYMENT }}"
