# Gerekli GitHub Secrets (Repository → Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME   — Docker Hub kullanıcı adı
#   DOCKERHUB_TOKEN      — Docker Hub Access Token (şifre değil; Account → Security)
#   KUBE_CONFIG_B64      — kubeconfig dosyasının tek satır base64’ü (satır sonları olmadan):
#                          base64 < ~/.kube/config | tr -d '\n'  → çıktıyı secret olarak yapıştırın
#
# İsteğe bağlı: farklı dal / namespace / release için aşağıdaki env bloğunu veya secrets ile override edin.

name: Build image and Helm upgrade

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pom.xml"
      - "helm/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-rent-api-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_REPO: tarikhamarat/algorycode-rent-service
  HELM_RELEASE: rent-api
  HELM_NAMESPACE: rent
  HELM_CHART: helm/algorycode-rent-service

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Maven package + Jib push
        run: |
          chmod +x mvnw
          ./mvnw -B -DskipTests -Djib.image.tag=${{ github.sha }} package jib:build

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Helm upgrade
        run: |
          helm upgrade --install "${{ env.HELM_RELEASE }}" "${{ env.HELM_CHART }}" \
            --namespace "${{ env.HELM_NAMESPACE }}" \
            --create-namespace \
            --set image.repository="${{ env.IMAGE_REPO }}" \
            --set image.tag="${{ github.sha }}"
