# AuthService CI/CD ile aynı desen: KUBE_CONFIG = base64 (tek satır veya boşluksuz); decode ile ~/.kube/config
#
# Gerekli Secrets (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME
#   DOCKERHUB_TOKEN
#   KUBE_CONFIG        — kubeconfig dosyasının base64’ü:
#                        base64 < ~/.kube/config | tr -d '\n\r '
#
# İsteğe bağlı: env bloğunda HELM_* / IMAGE_NAME / branches değiştirin.

name: Build image and Helm upgrade

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pom.xml"
      - "helm/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-rent-api-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: algorycode-rent-service
  HELM_RELEASE: rent-api
  HELM_NAMESPACE: rent
  HELM_CHART: helm/algorycode-rent-service

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # AuthService ile aynı: Jib doğrudan Docker Hub’a push (docker/login gerekmez)
      - name: Build and push Docker image with Jib
        run: |
          chmod +x mvnw
          SHORT_SHA=${GITHUB_SHA::7}
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          ./mvnw -B -DskipTests compile jib:build \
            -Djib.to.image="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest" \
            -Djib.to.tags="${SHORT_SHA},${GITHUB_SHA}" \
            -Djib.to.auth.username=${{ secrets.DOCKERHUB_USERNAME }} \
            -Djib.to.auth.password=${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: v1.28.0

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      # AuthService ile aynı: secret tek satır base64 (newline/boşluk temizlenir)
      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | tr -d '\n\r ' | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Helm upgrade
        run: |
          helm upgrade --install "${{ env.HELM_RELEASE }}" "${{ env.HELM_CHART }}" \
            --namespace "${{ env.HELM_NAMESPACE }}" \
            --create-namespace \
            --kube-insecure-skip-tls-verify \
            --set image.repository="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}" \
            --set image.tag="${SHORT_SHA}"
