name: algorycode-rent-service CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: rent-service-build-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: algorycode-rent-service
  K8S_NAMESPACE: algory-prod
  K8S_DEPLOYMENT: algorycode-rent-service-prod

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image tag
        run: |
          TAG="${GITHUB_SHA: -7}"
          echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"
          docker build -t "${IMAGE}:${IMAGE_TAG}" .
          docker push "${IMAGE}:${IMAGE_TAG}"

      - uses: azure/setup-kubectl@v4
        with:
          version: v1.28.0

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | tr -d '\n\r ' | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Deploy to k3s
        env:
          CONTAINER_NAME: ${{ vars.K8S_CONTAINER_NAME || 'algorycode-rent-service' }}
        run: |
          set -euo pipefail
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"
          NS="${{ env.K8S_NAMESPACE }}"
          DEPLOY="${{ env.K8S_DEPLOYMENT }}"
          kubectl --insecure-skip-tls-verify -n "$NS" set image \
            "deployment/$DEPLOY" "$CONTAINER_NAME=${IMAGE}:${IMAGE_TAG}"
          kubectl --insecure-skip-tls-verify -n "$NS" rollout status "deployment/$DEPLOY"
