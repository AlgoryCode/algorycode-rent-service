# Sadece Docker imaj? �retir ve registry'ye push eder. Da??t?m Argo CD ile yap?l?r ?
# Argo taraf?nda image.tag'i bu pipeline'?n �retti?i k?sa SHA (veya latest) ile e?le?tirin.
#
# Secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
#
# Push edilen etiketler: latest, ${GITHUB_SHA::7}, tam $GITHUB_SHA.

name: Build and push Docker image

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pom.xml"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: docker-rent-api-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: algorycode-rent-service

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tags from commit
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          echo "Pushing tags: latest, ${SHORT_SHA}, ${GITHUB_SHA}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"
          docker build -t "${IMAGE}:${SHORT_SHA}" -t "${IMAGE}:${GITHUB_SHA}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${SHORT_SHA}"
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"
