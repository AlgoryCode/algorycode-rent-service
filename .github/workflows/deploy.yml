# main’e her push. Tek Docker etiketi: tam commit SHA’nın son 7 karakteri (${GITHUB_SHA: -7}), ör. ...b84fc5f.
# Argo CD’de image.tag ile aynı değeri kullan.
#
# Secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN

name: Build and push Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-rent-api-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: algorycode-rent-service

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image tag from commit (last 7 chars of SHA)
        run: |
          IMAGE_TAG="${GITHUB_SHA: -7}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "Pushing single tag (suffix): ${IMAGE_TAG}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"
          docker build -t "${IMAGE}:${IMAGE_TAG}" .
          docker push "${IMAGE}:${IMAGE_TAG}"
