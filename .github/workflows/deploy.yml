# algorycode-rent-service — CI/CD (pom.xml Jib + helm/algorycode-rent-service)
#
# Secrets:
#   DOCKERHUB_USERNAME / DOCKERHUB_TOKEN  — Docker Hub (tarikhamarat ile uyumlu hesap)
#   KUBE_CONFIG                         — ~/.kube/config dosyasının base64 tek satırı:
#                                         base64 < ~/.kube/config | tr -d '\n\r '
#
# İmaj adı pom ve values ile aynı: tarikhamarat/algorycode-rent-service

name: algorycode-rent-service CI/CD

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pom.xml"
      - "helm/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: rent-service-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_REPO: tarikhamarat/algorycode-rent-service
  HELM_RELEASE: rent-api
  HELM_NAMESPACE: rent
  HELM_CHART: helm/algorycode-rent-service

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Maven package + Jib push
        run: |
          chmod +x mvnw
          SHORT_SHA=${GITHUB_SHA::7}
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          ./mvnw -B -DskipTests package jib:build -Djib.image.tag="${SHORT_SHA}"

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | tr -d '\n\r ' | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Helm upgrade
        run: |
          helm upgrade --install "${{ env.HELM_RELEASE }}" "${{ env.HELM_CHART }}" \
            --namespace "${{ env.HELM_NAMESPACE }}" \
            --create-namespace \
            --kube-insecure-skip-tls-verify \
            --set image.repository="${{ env.IMAGE_REPO }}" \
            --set image.tag="${SHORT_SHA}"
