# Jib / CI: imaj etiketi latest; pullPolicy Always ile yeni digest çekilir
replicaCount: 1

nameOverride: ""
fullnameOverride: ""

image:
  repository: tarikhamarat/algorycode-rent-service
  tag: latest
  pullPolicy: Always

imagePullSecrets: []
# - name: regcred

containerPort: 8090

service:
  type: ClusterIP
  port: 8090

# application.yml ile uyumlu; üretimde validate veya none önerilir
spring:
  applicationName: algorycode-rent-service
  jpa:
    ddlAuto: update
    showSql: "false"

# Dış broker DNS (A kaydı sunucuya); kümede iç servis kullanılıyorsa host’u değiştirin
rabbitmq:
  host: rabbitmq.algorycode.com
  port: "5672"
  virtualHost: "/"

app:
  cors:
    allowedOriginPatterns: "*"
  mail:
    rabbit:
      exchange: rent.mail
      routingKey: mail.send.requested
      queueDlq: rent.mail.dlq
  rentalRequest:
    greenInsuranceFee: "75.00"
  contract:
    # Pod içinde şablonun yolu (volume mount veya image içine koyabilirsiniz).
    templatePath: /app/contracts/KURU_GLOBAL_SOZLESME.pdf
    outputDir: /app/generated-contracts
  whatsapp:
    enabled: "true"
    adminPhoneE164: "905312187455"
    webhookUrl: ""
    webhookAuthBearer: ""
    callmebotApiKey: ""

logging:
  levelRent: INFO

secret:
  data:
    springDatasourceUrl: jdbc:mysql://45.147.47.129:3306/algorycoderentdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    springDatasourceUsername: root
    springDatasourcePassword: algorycode1.
    springRabbitmqUsername: admin
    springRabbitmqPassword: GuvenliSifre123

extraEnv: []

resources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "1Gi"
    cpu: "1000m"

podSecurityContext: {}
securityContext: {}

probes:
  startup:
    # Tam /actuator/health Rabbit/DB ile 503 verebilir; JVM yavaşken varsayılan 1s timeout yetmez
    path: /actuator/health/liveness
    failureThreshold: 60
    periodSeconds: 5
    timeoutSeconds: 10
  readiness:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  liveness:
    initialDelaySeconds: 90
    periodSeconds: 20
    timeoutSeconds: 5

ingress:
  enabled: false
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: rent.algorycode.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: rent-algorycode-tls
      hosts:
        - rent.algorycode.com
