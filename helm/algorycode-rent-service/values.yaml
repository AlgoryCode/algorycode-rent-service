# Jib / CI: imaj etiketi latest; pullPolicy Always ile yeni digest çekilir
replicaCount: 1

nameOverride: ""
fullnameOverride: ""

image:
  repository: tarikhamarat/algorycode-rent-service
  tag: latest
  pullPolicy: Always

imagePullSecrets: []
# - name: regcred

containerPort: 8090

service:
  type: ClusterIP
  port: 8090

# application.yml ile uyumlu; üretimde validate veya none önerilir
spring:
  applicationName: algorycode-rent-service
  jpa:
    ddlAuto: update
    showSql: "false"

# Eureka — doğrudan erişilebilir adres (DNS / LB). Boş bırakılırsa cluster içi sameNamespace / crossNamespace kullanılır.
# Not: eureka.algorycode.com genelde Ingress üzerinden 80/443’tedir; :8070 dışarıdan kapalı olabilir.
eureka:
  clientServiceUrlDefaultZone: "https://eureka.algorycode.com/eureka/"
  crossNamespace:
    enabled: false
    k8sServiceName: eurekaserver
    k8sNamespace: default
    port: 8070
  sameNamespace:
    serviceName: eurekaserver
    port: 8070

# Dış broker DNS (A kaydı sunucuya); kümede iç servis kullanılıyorsa host’u değiştirin
rabbitmq:
  host: rabbitmq.algorycode.com
  port: "5672"
  virtualHost: "/"

app:
  cors:
    allowedOriginPatterns: "*"
  mail:
    rabbit:
      exchange: algorycode.mail.exchange
      routingKey: mail.send.requested
      queueDlq: algorycode.mail.work-queue.dlq
  rentalRequest:
    greenInsuranceFee: "75.00"
  contract:
    templatePath: ""
    outputDir: /app/generated-contracts
    pdfLineVatPercent: "20"
    authorization:
      taxablePersonName: "KURU GLOBAL"
      niptNumber: "M51406058A"
      representativeName: "TARIK KURU"
      representativeBirthPlace: "ISTANBUL"
      representativeResidence: "TIRAN"
      representativeBirthDate: "21/07/2000"
      representativePassportNo: "U36724300"
      footerCompany: "KURU GLOBAL"
      footerAddress: "RINAS AIRPORT - Rinas, Albania."
      roadsideAssistancePhone: "+90 510 220 553"
  whatsapp:
    enabled: "true"
    adminPhoneE164: "905312187455"
    webhookUrl: ""
    webhookAuthBearer: ""
    callmebotApiKey: ""
  objectStorage:
    enabled: "true"
    endpoint: "https://s3.algorycode.com"
    bucket: "rent"
    keyPrefix: "prod"
    presignExpirySeconds: "3600"

logging:
  levelRent: INFO

secret:
  data:
    springDatasourceUrl: jdbc:postgresql://45.147.47.129:5432/algorycoderentdb
    springDatasourceUsername: postgres
    springDatasourcePassword: algorycode1.
    springRabbitmqUsername: admin
    springRabbitmqPassword: GuvenliSifre123
    appObjectStorageAccessKey: "ld88HanEcv4q2BR0"
    appObjectStorageSecretKey: "DuE4w8K3jONhT8FfTd2ZaUzkszlJ4r0i"

extraEnv: []

resources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "1Gi"
    cpu: "1000m"

podSecurityContext: {}
securityContext: {}

probes:
  startup:
    # Tam /actuator/health Rabbit/DB ile 503 verebilir; JVM yavaşken varsayılan 1s timeout yetmez
    path: /actuator/health/liveness
    failureThreshold: 60
    periodSeconds: 5
    timeoutSeconds: 10
  readiness:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  liveness:
    initialDelaySeconds: 90
    periodSeconds: 20
    timeoutSeconds: 5

ingress:
  enabled: false
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: rent.algorycode.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: rent-algorycode-tls
      hosts:
        - rent.algorycode.com
